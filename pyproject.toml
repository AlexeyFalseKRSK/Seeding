[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seeding"
version = "1.0.0"
description = "Simplified desktop GUI for seedling image analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt5>=5.15",
    "numpy>=1.23",
    "opencv-python>=4.7.0",
    "Pillow>=9.4.0",
    "PyMuPDF>=1.22.0",
    "ultralytics>=8.0.0",
    "reportlab>=3.6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
include = ["seeding*"]

[project.scripts]
seeding = "seeding:main"
seeding-users = "seeding.manage_users:main"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".venv",
    "seeding.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
]
